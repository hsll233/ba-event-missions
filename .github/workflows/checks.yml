name: Source checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python test_mission_flow.py
      - run: python -m compileall -q -x 'vendor|dist' .
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile WinForms launcher with the selected icon
        shell: pwsh
        run: |
          $launcher = Join-Path $PWD 'packaging\Launcher.cs'
          $icon = Join-Path $PWD 'packaging\app.ico'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /platform:x64 /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll "/win32icon:$icon" /out:launcher-test.exe $launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
